<!doctype html><meta charset="utf-8"><body style="font:14px sans-serif;margin:8px"><h3>Testes LIMPA!</h3><ol id="out"></ol>
<iframe id="f" src="index.html" style="width:412px;height:800px;border:1px solid #999"></iframe>
<script>
const out=document.getElementById("out"),f=document.getElementById("f");
const log=(ok,t)=>{const li=document.createElement("li");li.textContent=(ok?"OK   ":"FALHA ")+t;li.style.color=ok?"green":"red";out.appendChild(li);fetch("/__resultado/"+encodeURIComponent(li.textContent.slice(0,110))).catch(()=>{})};
window.addEventListener("unhandledrejection",e=>log(false,"exceção no teste: "+(e.reason&&e.reason.message||e.reason)));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const errs=[];
f.addEventListener("load",async()=>{
  const w=f.contentWindow,d=f.contentDocument;
  w.addEventListener("error",e=>errs.push(e.message));
  await sleep(1500);
  const h2=()=>d.querySelector("#result h2").textContent.trim();
  const largos=[...d.querySelectorAll("body *")].filter(el=>{const r=el.getBoundingClientRect();return r.right>413&&r.width>0&&!el.closest(".quotes,.quick,.scan")}).slice(0,4).map(el=>el.tagName+"."+el.className+" "+Math.round(el.getBoundingClientRect().right)+"px");
  log(d.documentElement.scrollWidth<=412,"sem rolagem horizontal ("+d.documentElement.scrollWidth+"px) "+largos.join(" ; "));
  const busca=async(q)=>{d.getElementById("q").value=q;d.getElementById("searchForm").dispatchEvent(new w.Event("submit",{cancelable:true}));await sleep(300);return h2()};
  let r;
  r=await busca("sofa"); log(r==="Sofá","busca 'sofa' → "+r);
  r=await busca("oleo"); log(/Óleo/.test(r),"busca 'oleo' → "+r);
  r=await busca("pizza suja"); log(/engordurada/.test(r),"busca 'pizza suja' → "+r);
  r=await busca("garrafinha de agua"); log(r==="Garrafa PET","busca 'garrafinha de agua' → "+r);
  r=await busca("xyzqwk"); log(/Não encontrei/.test(r)&&/156/.test(d.getElementById("result").textContent),"item inexistente → Fallback 156");
  log(/Fonte:/.test(d.getElementById("result").textContent),"card com fonte");
  for(const v of ["ecopontos","cores","quiz","consultar"]){w.location.hash=v;await sleep(200);log(!d.getElementById("v-"+v).hidden,"aba "+v)}
  log(d.querySelectorAll("#ecoAll .eco").length===9,"9 Ecopontos listados");
  log(d.querySelectorAll("#v-cores .color").length===10,"10 cores CONAMA");
  // código de barras real (Open Food Facts)
  r=await busca("7894900011517"); await sleep(9000);
  const txt=d.getElementById("result").textContent;
  log(/Embalagem desrotulada|Embalagem provável|não cadastrado|não informa/.test(txt),"código 7894900011517 → "+h2()+" | "+[...d.querySelectorAll(".part b")].map(x=>x.textContent).join("; ")+" | "+[...d.querySelectorAll(".part small")].map(x=>x.textContent).join("; "));
  r=await busca("7891000100103"); await sleep(9000);
  log(true,"código 7891000100103 → "+h2()+" | "+[...d.querySelectorAll(".part b")].map(x=>x.textContent).join("; ")+" | "+[...d.querySelectorAll(".part small")].map(x=>x.textContent).join("; "));
  // Limpinho no layout
  log(d.querySelectorAll(".lp svg").length>=6,"Limpinho desenhado ("+d.querySelectorAll(".lp svg").length+" poses na tela)");
  // Leitura de QR Code / DataMatrix / GS1
  const T=w.LIMPA_TESTE;
  const casos=[["7891000100103","7891000100103"],["https://id.gs1.org/01/07891000100103/10/LOTE1","07891000100103"],["]d2010789100010010317250101","07891000100103"],["(01)07894900011517(17)261231","07894900011517"],["https://www.coca-cola.com.br/promo","null"]];
  for(const [e,esp] of casos) log(String(T.extrairGTIN(e))===esp,"extrairGTIN("+e.slice(0,40)+") → "+T.extrairGTIN(e));
  const inf=[[{product_name:"Refrigerante Coca-Cola 2Lt",categories_tags:["en:sodas"]},"pet"],[{product_name:"Coca Cola LT 350ml"},"lata"],
    [{product_name:"Cerveja Heineken",quantity:"350 ml",categories_tags:["en:beers"]},"lata"],[{product_name:"Leite UHT Integral",categories_tags:["en:milks"]},"longavida"],
    [{product_name:"Iogurte Natural Integral"},"pote"],[{product_name:"Biscoito doce maizena"},"salgadinho"],[{product_name:"Milho em conserva"},"conserva"],[{product_name:"Arroz tipo 1"},"sacola"]];
  for(const [p,esp] of inf){const r=T.inferirEmbalagem(p);log(r&&r.opcoes[0]===esp,"embalagem provável de '"+p.product_name+"' → "+(r?r.opcoes.join("/"):"nada"))}
  r=await busca("7894900011517"); await sleep(9000);
  log(/Embalagem provável|desrotulada/.test(d.getElementById("result").textContent),"Coca-Cola 2L (sem material no cadastro) → "+[...d.querySelectorAll(".part small")].map(x=>x.textContent).join(" ; "));
  // Foto: reconhecimento no aparelho (simula a escolha de um arquivo)
  const fotos=await fetch("/testes/amostras.json").then(r=>r.json()).catch(()=>[]);
  const amostras=[...fotos.filter(a=>/HEINEKEN|maizena|Knorr/i.test(a.nome)).map(a=>[a.img,a.nome]),["/testes/limpinho.jpeg","mascote (não é resíduo)"]];
  for(const [url,nome] of amostras){
    const blob=await (await fetch(url)).blob();
    const dt=new w.DataTransfer(); dt.items.add(new w.File([blob],"foto.jpg",{type:blob.type||"image/jpeg"}));
    const cam=d.getElementById("cam"); cam.files=dt.files; cam.dispatchEvent(new w.Event("change"));
    const t0=performance.now();
    while(performance.now()-t0<90000){ await sleep(500); if(!/olhando/.test(h2())) break; }
    const chips=[...d.querySelectorAll("#result .items button")].map(b=>b.textContent.trim()).join(", ");
    log(!/olhando/.test(h2()),"foto '"+nome+"' → "+h2()+(chips?" [opções: "+chips+"]":"")+" ("+Math.round((performance.now()-t0)/1000)+" s)");
  }
  log(errs.length===0,"erros JS: "+(errs.join(" | ")||"nenhum"));
  document.title="FIM";
  await fetch("/__resultado/"+encodeURIComponent(out.innerText.replace(/\n/g," || "))).catch(()=>{});
});
</script>
